name: Verify everything works before publish

on:
  push:
    branches:
      - *
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - run: chmod +x ./mvnw
      - run: ./mvnw -B verify