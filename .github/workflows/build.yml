name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build with Maven Wrapper via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build project with Maven Wrapper via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            eclipse-temurin:11-jdk \
            ./mvnw clean package
